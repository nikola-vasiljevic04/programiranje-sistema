# Naziv aplikacije i port
spring.application.name=vodici-service
server.port=8083

# H2 Baza u memoriji
spring.datasource.url=jdbc:h2:mem:vodicidb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=milan
spring.datasource.password=

# JPA / Hibernate pode?avanja
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Svaki restart pravi sve?u bazu sa novim kolonama (re?ava problem sa issuing_body)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pode?avanja za inicijalizaciju podataka
spring.sql.init.mode=always
# ?ekamo Hibernate da napravi tabele, pa onda ubacujemo podatke iz data.sql
spring.jpa.defer-datasource-initialization=true

# H2 Konzola - http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true


# Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.vodici-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.vodici-service.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.vodici-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.vodici-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.vodici-service.register-health-indicator=true

# Retry
resilience4j.retry.instances.vodici-service.max-attempts=3
resilience4j.retry.instances.vodici-service.wait-duration=500ms
resilience4j.retry.instances.vodici-service.retry-exceptions=feign.FeignException

# Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Logging
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cloud.openfeign=WARN
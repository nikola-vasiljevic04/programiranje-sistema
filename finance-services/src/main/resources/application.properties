spring.application.name=finance-services
server.port=8091

# H2 Database Setup
spring.datasource.url=jdbc:h2:mem:financedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=financepswd
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate / JPA Setup
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Circuit Breaker
resilience4j.circuitbreaker.instances.booking-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.booking-service.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.booking-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.booking-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.booking-service.register-health-indicator=true

# Retry
resilience4j.retry.instances.booking-service.max-attempts=3
resilience4j.retry.instances.booking-service.wait-duration=500ms
resilience4j.retry.instances.booking-service.retry-exceptions=feign.FeignException

# Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Logging
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cloud.openfeign=WARN
spring.application.name=gateway-service
server.port=8080

# --- 1. AUTH SERVICE ---
spring.cloud.gateway.server.webflux.routes[1].id=auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8079
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**, /docs/auth/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/docs/auth/(?<segment>.*), /${segment}

# --- 2. BOOKING SERVICE ---
spring.cloud.gateway.server.webflux.routes[0].id=booking-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8090
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/bookings/**,/api/guides/**,/docs/booking/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/docs/booking/(?<segment>.*), /${segment}

# --- SWAGGER UI ---
springdoc.swagger-ui.urls[0].name=Booking Service
springdoc.swagger-ui.urls[0].url=/docs/booking/v3/api-docs

springdoc.swagger-ui.urls[1].name=Auth Service
springdoc.swagger-ui.urls[1].url=/docs/auth/v3/api-docs
springdoc.api-docs.path=/v3/api-docs

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

server.port=8080

gateway.rate-limit.read=50
gateway.rate-limit.write=5
gateway.rate-limit.window-ms=10000

# --- AUTH SERVICE ---
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8079
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/docs/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/docs/auth/(?<segment>.*), /${segment}

# --- BOOKING SERVICE ---
spring.cloud.gateway.server.webflux.routes[1].id=booking-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8090
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/bookings/**,/api/guests/**,/api/policies/**,/api/addons/**,/docs/booking/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/docs/booking/(?<segment>.*), /${segment}

# --- FINANCE SERVICE ---
spring.cloud.gateway.server.webflux.routes[2].id=finance-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8091
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/invoices/**,/api/payment-methods/**,/api/tax-rates/**,/api/transactions/**,/docs/finance/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/docs/finance/(?<segment>.*), /${segment}

# --- ACCOMMODATION SERVICE ---
spring.cloud.gateway.server.webflux.routes[3].id=accommodation-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/availability/**,/api/units/**,/api/addresses/**,/docs/accommodation/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/docs/accommodation/(?<segment>.*), /${segment}

# --- MAINTENANCE SERVICE ---
spring.cloud.gateway.server.webflux.routes[4].id=maintenance-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/workers/**,/api/work-orders/**,/api/tasks/**,/docs/maintenance/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/docs/maintenance/(?<segment>.*), /${segment}

# --- GUIDES SERVICE ---
spring.cloud.gateway.server.webflux.routes[5].id=vodici-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/languages/**,/api/guide-profiles/**,/api/guide-languages/**,/api/certifications/**,/docs/vodici/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/docs/vodici/(?<segment>.*), /${segment}

# --- ADVENTURE SERVICE ---
spring.cloud.gateway.server.webflux.routes[6].id=avanture-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/time-slots/**,/api/reviews/**,/api/gear/**,/api/categories/**,/api/adventures/**,/docs/avanture/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/docs/avanture/(?<segment>.*), /${segment}

# --- SWAGGER UI ---
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/docs/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=Booking Service
springdoc.swagger-ui.urls[1].url=/docs/booking/v3/api-docs

springdoc.swagger-ui.urls[2].name=Finance Service
springdoc.swagger-ui.urls[2].url=/docs/finance/v3/api-docs

springdoc.swagger-ui.urls[3].name=Accommodation Service
springdoc.swagger-ui.urls[3].url=/docs/accommodation/v3/api-docs

springdoc.swagger-ui.urls[4].name=Maintenance Service
springdoc.swagger-ui.urls[4].url=/docs/maintenance/v3/api-docs

springdoc.swagger-ui.urls[5].name=Vodici Service
springdoc.swagger-ui.urls[5].url=/docs/vodici/v3/api-docs

springdoc.swagger-ui.urls[6].name=Avanture Service
springdoc.swagger-ui.urls[6].url=/docs/avanture/v3/api-docs

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*,x-api-key,X-API-KEY
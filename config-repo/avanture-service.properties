server.port=8084

# ==============================================================
# KONFIGURACIJA H2 BAZE (U MEMORIJI)
# ==============================================================
spring.datasource.url=jdbc:h2:mem:avanturedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==============================================================
# JPA / HIBERNATE PODE?AVANJA
# ==============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Prvo Hibernate pravi tabele na osnovu Java klasa
spring.jpa.hibernate.ddl-auto=create-drop

# Prikazuj SQL upite u konzoli (korisno za debagovanje)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# INICIJALIZACIJA PODATAKA (data.sql)
# ==============================================================
# 1. ?ekamo da Hibernate napravi tabele pre nego ?to ubacimo podatke
spring.jpa.defer-datasource-initialization=true

# 2. Forsiramo pokretanje SQL skripti pri svakom paljenju
spring.sql.init.mode=always

# 3. Putanja do tvoje skripte sa podacima
spring.sql.init.data-locations=classpath:data.sql

# ==============================================================
# ALATI ZA TESTIRANJE (H2 Konzola i Swagger)
# ==============================================================
# H2 Konzola: http://localhost:8081/h2-console
# (Kada se uloguje?, JDBC URL mora biti: jdbc:h2:mem:avanturedb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.vodici-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.vodici-service.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.vodici-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.vodici-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.vodici-service.register-health-indicator=true

# Retry
resilience4j.retry.instances.vodici-service.max-attempts=3
resilience4j.retry.instances.vodici-service.wait-duration=500ms
resilience4j.retry.instances.vodici-service.retry-exceptions=feign.FeignException

# Actuator
management.health.circuitbreakers.enabled=true
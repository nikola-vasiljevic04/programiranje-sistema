server.port=8081

# H2 Baza u memoriji (promenjen naziv u accommodationdb)
spring.datasource.url=jdbc:h2:mem:accommodationdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate pode?avanja
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# "update" je sigurnije ako menja? kod ?esto, ali "create-drop" ?isti bazu pri svakom ga?enju
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicijalizacija podataka (data.sql)
# BITNO: Ako nema? schema.sql, napravi prazan fajl u src/main/resources
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 Console pristup (http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

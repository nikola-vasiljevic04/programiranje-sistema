server.port=8082

accommodation.service.url=http://localhost:8081/api

# H2 Baza u memoriji za maintenance
spring.datasource.url=jdbc:h2:mem:maintenancedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate podesavanja
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicijalizacija podataka
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 Console (Pristup na http://localhost:8082/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Swagger putanja (Pristup na http://localhost:8082/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html


resilience4j.circuitbreaker.instances.unit-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.accommodation-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.unit-service.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.unit-service.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.unit-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.unit-service.register-health-indicator=true

resilience4j.retry.instances.accommodation-service.max-attempts=3
resilience4j.retry.instances.accommodation-service.wait-duration=500ms
resilience4j.retry.instances.accommodation-service.retry-exceptions=feign.FeignException


management.health.circuitbreakers.enabled=true

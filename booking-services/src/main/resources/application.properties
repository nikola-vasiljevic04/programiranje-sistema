spring.application.name=booking-services
server.port=8090

# H2 Database Setup
spring.datasource.url=jdbc:h2:mem:bookingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=bookingpswd
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate / JPA Setup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.finance-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.finance-service.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.finance-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.finance-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.finance-service.register-health-indicator=true

resilience4j.circuitbreaker.instances.unit-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.unit-service.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.unit-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.unit-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.unit-service.register-health-indicator=true

# Retry
resilience4j.retry.instances.finance-service.max-attempts=3
resilience4j.retry.instances.finance-service.wait-duration=500ms
resilience4j.retry.instances.finance-service.retry-exceptions=feign.FeignException

resilience4j.retry.instances.unit-service.max-attempts=3
resilience4j.retry.instances.unit-service.wait-duration=500ms
resilience4j.retry.instances.unit-service.retry-exceptions=feign.FeignException

# Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Logging
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cloud.openfeign=WARN
spring.application.name=maintenance-service
server.port=8082
# Osnovna pode?avanja

# H2 Baza u memoriji za maintenance
spring.datasource.url=jdbc:h2:mem:maintenancedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate pode?avanja
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicijalizacija podataka
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 Console (Pristup na http://localhost:8082/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

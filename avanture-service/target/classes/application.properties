# ==============================================================
# OSNOVNA PODE?AVANJA MIKROSERVISA
# ==============================================================
spring.application.name=avanture-service
server.port=8084

# ==============================================================
# KONFIGURACIJA H2 BAZE (U MEMORIJI)
# ==============================================================
spring.datasource.url=jdbc:h2:mem:avanturedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==============================================================
# JPA / HIBERNATE PODE?AVANJA
# ==============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Prvo Hibernate pravi tabele na osnovu Java klasa
spring.jpa.hibernate.ddl-auto=create-drop

# Prikazuj SQL upite u konzoli (korisno za debagovanje)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# INICIJALIZACIJA PODATAKA (data.sql)
# ==============================================================
# 1. ?ekamo da Hibernate napravi tabele pre nego ?to ubacimo podatke
spring.jpa.defer-datasource-initialization=true

# 2. Forsiramo pokretanje SQL skripti pri svakom paljenju
spring.sql.init.mode=always

# 3. Putanja do tvoje skripte sa podacima
spring.sql.init.data-locations=classpath:data.sql

# ==============================================================
# ALATI ZA TESTIRANJE (H2 Konzola i Swagger)
# ==============================================================
# H2 Konzola: http://localhost:8081/h2-console
# (Kada se uloguje?, JDBC URL mora biti: jdbc:h2:mem:avanturedb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Logging
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cloud.openfeign=WARN